[project]
name = "transcriber"
version = "0.1.1"
description = "Локальный транскрибатор звонков с маскированием персональных данных"
readme = "README.md"
authors = [
    { name = "Sergey Verentsov", email = "north1605@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "av>=19.0.1",
    "charset-normalizer>=3.5.2",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "natasha>=1.6.0",
    "navec>=0.10.0",
    "numpy>=2.5.4",
    "onnx-asr>=0.12.0",
    "onnxruntime>=1.31.0",
    "platformdirs>=4.13.0",
    "pymorphy3>=2.0.6",
    "pymorphy3-dicts-ru>=2.4.417150.4580142",
    "python-docx>=1.2.0",
    "razdel>=0.5.0",
    "sherpa-onnx>=1.13.8",
    "slovnet>=0.6.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
transcriber = "transcriber:main"

# Запуск без окна консоли (Windows) — для ярлыка и .app.
[project.gui-scripts]
transcriber-app = "transcriber.cli:app_main"

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Сеть в тестах запрещена: разрешён только локальный адрес.
addopts = "--allow-hosts=127.0.0.1,localhost -q"
markers = ["slow: требует моделей распознавания"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]
